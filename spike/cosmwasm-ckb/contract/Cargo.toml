[package]
name = "ckb-verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = "2.2"
cosmwasm-schema = "2.2"
serde = { version = "1.0", default-features = false, features = ["derive"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
# Shipped wasm only needs G1 scalar muls for vk_x; the final pairing runs in the chain's host function. So no
# "pairings" feature here -> the Miller loop / final exponentiation / Fp12 code is dropped from the wasm.
bls12_381 = { version = "0.8", default-features = false, features = ["groups", "alloc"] }
# Standard BLAKE2b-256, for deriving the value+recipient commitment public input from a concrete CKB event
# (matches the circuit's b2b() = unkeyed 32-byte BLAKE2b).
blake2 = { version = "0.10", default-features = false }

[dev-dependencies]
num-bigint = "0.4"
serde_json = "1.0"
# Tests cross-check the host-fn refactor against the original all-in-wasm pairing, so the reference needs
# "pairings". Cargo unifies this with the [dependencies] entry for test/dev builds only; the wasm release build
# (no dev-deps) keeps pairings off and stays small.
bls12_381 = { version = "0.8", default-features = false, features = ["groups", "pairings", "alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
